<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 World Championship Live Standings</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: rgba(22, 27, 38, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --f1-red: #e10600;
            --text-main: #ffffff;
            --text-muted: #a1a8b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--f1-red);
        }

        header h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .badge-live {
            background-color: var(--f1-red);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Chart Section Styling */
        .chart-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            backdrop-filter: blur(10px);
            position: relative;
            height: 380px;
        }

        /* Grid layout για τις κάρτες των οδηγών */
        .drivers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .driver-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .driver-card:hover {
            transform: translateY(-4px);
            border-color: var(--f1-red);
        }

        .driver-position {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 2.2rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.15);
        }

        .driver-number {
            color: var(--f1-red);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .driver-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        /* Styling για τη φωτογραφία του οδηγού */
        .driver-photo-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 0.8rem;
        }

        .driver-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--f1-red);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .team-name {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 0.2rem;
        }

        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏎️ F1 Driver Standings</h1>
        <span class="badge-live">Live Data</span>
    </header>

    <div id="loading" class="loading">Φόρτωση δεδομένων από το F1 API...</div>

    <!-- Chart Section -->
    <div id="chart-wrapper" class="chart-section" style="display: none;">
        <canvas id="pointsChart"></canvas>
    </div>

    <!-- Drivers Grid -->
    <div id="drivers-container" class="drivers-grid"></div>

    <script>
        let chartInstance = null;

        // Xάρτης φωτογραφιών οδηγών βάσει του driverId από το API
        const driverPhotos = {
            "max_verstappen": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/M/MAXVER01_Max_Verstappen/maxver01.png",
            "verstappen": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/M/MAXVER01_Max_Verstappen/maxver01.png",
            "norris": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/L/LANNOR01_Lando_Norris/lannor01.png",
            "leclerc": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/C/CHALEC01_Charles_Leclerc/chalec01.png",
            "piastri": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/O/OSCPIA01_Oscar_Piastri/oscpia01.png",
            "sainz": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/C/CARSAI01_Carlos_Sainz/carsai01.png",
            "hamilton": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/L/LEWHAM01_Lewis_Hamilton/lewham01.png",
            "russell": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/G/GEORUS01_George_Russell/georus01.png",
            "perez": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/S/SERPER01_Sergio_Perez/serper01.png",
            "alonso": "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/F/FERALO01_Fernando_Alonso/feralo01.png"
        };

        // Εναλλακτική εικόνα (silhouette) αν δεν υπάρχει φωτογραφία στο map ή αποτύχει το φορτίο
        const fallbackImage = "https://media.formula1.com/d_driver_fallback_image.png/content/dam/fom-website/drivers/driver_fallback_image.png";

        function renderChart(data) {
            const ctx = document.getElementById('pointsChart').getContext('2d');
            
            const topDrivers = data.slice(0, 10);
            const labels = topDrivers.map(item => item.Driver.familyName);
            const points = topDrivers.map(item => parseInt(item.points));

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Βαθμοί Σεζόν',
                        data: points,
                        backgroundColor: '#e10600',
                        borderColor: '#ff3b35',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#ffffff' } },
                        title: {
                            display: true,
                            text: 'Σύγκριση Βαθμών (Top 10 Drivers)',
                            color: '#ffffff',
                            font: { size: 16, weight: 'bold' }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#a1a8b8' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        },
                        y: {
                            ticks: { color: '#a1a8b8' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        }
                    }
                }
            });
        }

        async function fetchStandings() {
            try {
                const response = await fetch('/api/standings');
                const data = await response.json();

                const loadingEl = document.getElementById('loading');
                const containerEl = document.getElementById('drivers-container');
                const chartWrapper = document.getElementById('chart-wrapper');

                loadingEl.style.display = 'none';
                chartWrapper.style.display = 'block';
                containerEl.innerHTML = '';

                renderChart(data);

                data.forEach(item => {
                    const driver = item.Driver;
                    const constructor = item.Constructors[0];
                    const position = item.position;
                    const points = item.points;
                    const wins = item.wins;

                    // Επιλογή φωτογραφίας ή fallback
                    const photoUrl = driverPhotos[driver.driverId] || fallbackImage;

                    const card = document.createElement('div');
                    card.className = 'driver-card';
                    card.innerHTML = `
                        <div class="driver-position">#${position}</div>
                        <div class="driver-number">N° ${driver.permanentNumber || '-'}</div>
                        <div class="driver-name">${driver.givenName} ${driver.familyName}</div>
                        
                        <!-- Φωτογραφία Οδηγού -->
                        <div class="driver-photo-wrapper">
                            <img src="${photoUrl}" 
                                 alt="${driver.familyName}" 
                                 class="driver-avatar" 
                                 onerror="this.onerror=null; this.src='${fallbackImage}';">
                        </div>

                        <div class="team-name">${constructor ? constructor.name : 'N/A'}</div>
                        <div class="stats-row">
                            <div class="stat-item">
                                <div class="stat-label">Βαθμοι</div>
                                <div class="stat-value">${points}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Νικες</div>
                                <div class="stat-value">${wins}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Εθνικοτητα</div>
                                <div class="stat-value">${driver.nationality}</div>
                            </div>
                        </div>
                    `;
                    containerEl.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loading').innerText = 'Σφάλμα κατά τη φόρτωση των δεδομένων.';
            }
        }

        fetchStandings();
    </script>
</body>
</html>
